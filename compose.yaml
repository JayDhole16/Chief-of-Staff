services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chief_of_staff}
      POSTGRES_USER: ${POSTGRES_USER:-chief_of_staff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chief_of_staff_dev}
    ports:
      # Published on localhost only, so `make dev-api` on the host can use it too.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chief_of_staff}:${POSTGRES_PASSWORD:-chief_of_staff_dev}@db:5432/${POSTGRES_DB:-chief_of_staff}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      # Used only when APP_ENCRYPTION_KEY is empty: generated once and kept on the volume.
      APP_KEY_FILE: /data/.app_encryption_key
      CORS_ORIGINS: http://localhost:3000
      # Google sign-in (Gmail + Calendar). Redirect URI = APP_BASE_URL + /api/integrations/google/callback
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_BASE_URL: http://localhost:3000
    volumes:
      - app_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/readyz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.worker.health"]
    environment:
      TOKEN_VAULT_PRIVATE_KEY: ${TOKEN_VAULT_PRIVATE_KEY:-}
    ports:
      - "8081:8081"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8081/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8080
      VITE_API_BASE: /api
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  app_data:
