## Environment Gating

### Backend

All pure functions, no environment gating needed. Guards (G01-G15) will gate policy decisions.

### Frontend

**Development** (.env.development):
```
VITE_USE_MSW=true
VITE_API_BASE=http://localhost:8000/api
```
→ MSW mocks enabled, development mode

**Production** (.env.production):
```
VITE_USE_MSW=false
VITE_API_BASE=/api
```
→ MSW tree-shaken by Vite, live API only

