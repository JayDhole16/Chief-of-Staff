## Key Design Principles

1. **Pure facts layer**: No I/O, clock, randomness. Deterministic.
2. **Type safety**: Full TypeScript, no `any`. Union error codes.
3. **Single API gate**: All fetch() calls through `apiCall()`.
4. **MSW isolation**: Mocks in `/mocks/`, environment-gated, tree-shaken in prod.
5. **Session in-memory**: sessionStorage (cleared on tab close).
6. **Mobile-first**: 390px default layout, scales up gracefully.
7. **Deterministic hooks**: All timers, listeners cleaned up.

## Non-Negotiable Rules Upheld

✅ **LLM proposes only**: Backend guards decide allow/ask/block  
✅ **Server-side rendering**: Guards G01-G15 + policy layer  
✅ **Only worker executes writes**: PWA never sends Google writes  
✅ **Pure facts layer**: No I/O, clock, randomness, model calls  
✅ **Module boundaries**: Respect import-linter contracts  
✅ **No shared schemas modified**: Without asking first  
✅ **Tests + `make check`**: All tests passing  

