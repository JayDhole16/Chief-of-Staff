## Architecture

### Backend: Pure Facts Layer

```
backend/domain/types.py         # Immutable domain types (Money, Discount, TrustedFacts)
backend/facts/inr_formatter.py  # INR format/parse (Indian grouping)
backend/facts/trusted_render.py # Template rendering + offer calculations
```

**Core design**:
- Pure functions (no I/O, no clock, no randomness)
- Integer math only (paise, no floats)
- Type-safe errors (PlaceholderError, OfferCalculationError)
- Deterministic across 100+ runs
- Audit trail (facts used in rendering)

**Example**:

```python
from backend.facts.trusted_render import render_template, calculate_offer
from backend.domain.types import TrustedFacts, Money, Discount, DiscountType

facts = TrustedFacts(facts={
    "deal.price": FactValue(Money(125000000), FactReference("f1", "db")),
    "deal.discount_pct": FactValue(10, FactReference("f2", "mandate")),
})

# Render
result = render_template("Price: {deal.price}, Discount: {deal.discount_pct}%", facts)
# result.text == "Price: ₹12,50,000, Discount: 10%"

# Calculate offer
offer = calculate_offer(
    base_price_paise=125000000,
    discount=Discount(DiscountType.PERCENTAGE, 10),
    floor_price_paise=80000000,
    mandate_max_discount_pct=20
)
# offer == 112500000 (90% of 125 million)
```

### Frontend: Mobile PWA

```
src/api/client.ts           # Single fetch wrapper (typed, error mapping)
src/mocks/handlers.ts       # MSW handlers (dev-only, environment-gated)
src/hooks/usePolling.ts     # Polling with backoff + pause
src/pages/LoginPage.tsx     # Login form (session storage)
src/pages/DashboardPage.tsx # 5-tab dashboard (mobile-first 390px)
```

**Key features**:
- Session in sessionStorage (in-memory, tab-isolated)
- All API calls through `apiCall()` (single gate)
- Error codes: 401, 403, 409, 422, 500, NETWORK, TIMEOUT
- Service Worker caches static assets only (not API)
- Bottom tab nav: Command, Approvals, Activity, Pipeline, Settings

