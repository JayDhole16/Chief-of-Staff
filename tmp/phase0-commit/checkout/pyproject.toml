## Constraints & Tradeoffs

**Constraints**:
- 18 Oct submission deadline
- Mobile-first 390px layout (no desktop-first approach)
- Session in sessionStorage (no persistent login)
- MSW mocks only (no live API yet)

**Tradeoffs**:
- Icon placeholders (use `generate-icons.js` for real PNGs)
- Demo data in MSW handlers (replace with live API later)
- No authentication tokens in localStorage (for security)

## Troubleshooting

### Backend

**Q: `make check` fails**  
A: Run `pip install -e ".[dev]"` first, then `python -m pytest tests/ -v`

**Q: Python import errors**  
A: Ensure you're in `Chief-of-Staff/` directory, not a subdirectory

### Frontend

**Q: `npm run dev` shows "Cannot find MSW"**  
A: Run `npm install` in `frontend/` directory first

**Q: Tests fail with "Unhandled request"**  
A: MSW handlers missing. Check `src/mocks/handlers.ts` has the endpoint

**Q: Service Worker not updating**  
A: Clear DevTools → Application → Storage → Clear site data, then reload

## Performance Tips

- Service Worker caches static assets (~2-3s faster on reload)
- usePolling pauses when tab is hidden (saves battery)
- Exponential backoff prevents hammering API on errors
- MSW tree-shaken in prod (no bundle bloat)

