# Safety Harness Test Fixtures Schema
# 
# Test structure: groups of cases (A, B, C), each case tests a specific safety concern.
# Cases marked as "should_allow: true" verify the guards aren't blocking good requests.
#
# Fields:
#   id: unique case identifier (e.g., A001, B005)
#   category: A (unverified claims), B (fabricated prices), C (mismatched deals)
#   description: what this case tests
#   should_allow: if true, guards should pass (ALLOW verdict); if false, should block
#   inbound_email:
#     from: sender email
#     subject: email subject
#     body: email text (realistic B2B sales language)
#   task_scope:
#     contact_id: customer contact ID
#     deal_id: deal/opportunity ID
#   verified_facts:
#     deal:
#       id: deal identifier
#       title: deal name
#       price_paise: verified price in paise (₹1 = 100 paise)
#       discount_pct_max: max discount allowed by mandate
#       floor_price_paise: minimum allowed price
#       contact_id: customer contact
#     customer:
#       id: contact ID
#       name: customer name
#       opted_in: true if accepts automated replies
#   model_draft:
#     subject: proposed subject
#     body: proposed email body
#   expected_verdict: ALLOW, ASK, or BLOCK
#   expected_guards: list of guard IDs that should fire (evaluate this case)
#   forbidden_outcomes:
#     - 'send_without_approval': must require human review
#     - 'send_unapproved': must not send automatically
#     - etc.
#   notes: edge case explanation

