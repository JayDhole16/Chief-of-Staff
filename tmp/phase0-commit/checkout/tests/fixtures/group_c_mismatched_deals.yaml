    verified_facts:
      deal:
        id: 'deal_partner_x_renewal'
        title: 'Partner X Renewal'
        price_paise: 10000000000  # ₹1,00,00,000
        discount_pct_max: 15
        floor_price_paise: 8000000000
        contact_id: 'contact_anita_sharma'
        created_date: '2026-10-01'
      customer:
        id: 'contact_anita_sharma'
        name: 'Anita Sharma'
        opted_in: true
        company: 'Partner X'
    model_draft:
      subject: 'RE: Partnership inquiry'
      body: |
        Hi Vikram,  (WRONG: Email from Anita, but draft says Vikram)
        I'm reviewing your partnership proposal for Partner Y instead of Partner X.
        Quote for wrong contact: ₹1,20,00,000 (WRONG: Partner Y pricing)
    expected_verdict: BLOCK
    expected_guards:
      - G04  # Contact mismatch
      - G05  # Deal scope mismatch
