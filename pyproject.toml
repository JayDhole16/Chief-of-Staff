[tool.importlinter]
root_package = "backend"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Domain stays isolated"
type = "forbidden"
source_modules = ["backend.domain"]
forbidden_modules = [
    "backend.api",
    "backend.contracts",
    "backend.db",
    "backend.facts",
    "backend.guards",
    "backend.policy",
    "backend.security",
    "backend.services",
    "backend.worker",
]

