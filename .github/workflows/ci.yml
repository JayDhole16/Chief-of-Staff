name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chief_of_staff_test
          POSTGRES_USER: chief_of_staff
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chief_of_staff -d chief_of_staff_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql://chief_of_staff:ci-test-password@localhost:5432/chief_of_staff_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q backend tests
      - run: >-
          python -c "import os, subprocess;
          env = os.environ.copy();
          env['DATABASE_URL'] = env['POSTGRES_TEST_DATABASE_URL'];
          subprocess.run(['python', '-m', 'backend.db.migrate'], env=env, check=True)"
      - run: lint-imports
      - run: >-
          ruff check --select I,F
          backend/config.py
          backend/main.py
          backend/api/app.py
          backend/services/app_store.py
          backend/services/llm.py
          backend/services/mailer.py
          backend/db/migrate.py
          backend/services/executor.py
          backend/services/tasks.py
          backend/services/actions.py
          backend/policy/engine.py
          backend/worker/health.py
          tests/test_config.py
          tests/test_api.py
          tests/test_tasks_service.py
          tests/test_policy_engine.py
          tests/test_tasks_postgres.py
          tests/test_worker_health.py
          scripts/smoke_app.py
      - run: python -m pytest -q
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm audit --omit=dev
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-local-test-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Verify application health
        run: |
          for attempt in $(seq 1 30); do
            if python scripts/smoke_app.py; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v
